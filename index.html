<!DOCTYPE html>
<html>
<head>
    <title>Hello Azure - Robin</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #0078d4, #00bcf2);
            color: #333;
        }

        .container {
            background: white;
            width: 90%;
            max-width: 600px;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            animation: fadeIn 1s ease-in-out;
        }

        .cloud {
            font-size: 70px;
            margin-bottom: 20px;
        }

        h1 {
            color: #0078d4;
            font-size: 38px;
            margin-bottom: 15px;
        }

        h2 {
            color: #107c10;
            margin-bottom: 25px;
            font-size: 24px;
        }

        p {
            font-size: 18px;
            margin: 12px 0;
            color: #555;
        }

        .badge {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 25px;
            background: #0078d4;
            color: white;
            border-radius: 30px;
            font-size: 16px;
            transition: 0.3s;
        }

        .badge:hover {
            background: #005a9e;
            transform: scale(1.05);
        }

        footer {
            margin-top: 30px;
            font-size: 14px;
            color: #777;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

    </style>
</head>

<body>

    <div class="container">

        <div class="cloud">
            ☁️
        </div>

        <h1>Hello Azure App Service!</h1>

        <h2>🚀 Deployment Successful</h2>

        <p>
            Welcome to my cloud deployment journey.
        </p>

        <p>
            My name is <strong>Robin</strong>.
        </p>

        <p>
            This is my first application deployed using
            <strong>Microsoft Azure App Service</strong>.
        </p>

        <div class="badge">
            Running on Azure ☁️
        </div>

        <footer>
            Built with Node.js + Azure App Service
        </footer>

    </div>

</body>
</html>
